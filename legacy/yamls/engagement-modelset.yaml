apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-tracking
  labels:
    mission: engagement
    model-set: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-tracking
  template:
    metadata:
      labels:
        app: target-tracking
    spec:
      containers:
      - name: model
        image: nginx:alpine
        resources:
          requests:
            cpu: "150m"
            memory: "128Mi"
