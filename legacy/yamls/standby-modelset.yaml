apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  labels:
    mission: standby
    model-set: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
    spec:
      containers:
      - name: model
        image: nginx:alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
